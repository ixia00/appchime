[package]
name = "appchime"
version = "0.1.0"
description = "Play a sound when an app opens or closes"
edition = "2021"
rust-version = "1.77"

[lib]
name = "appchime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-watch = { path = "../crates/app-watch" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
base64 = "0.22"
sys-locale = "0.3"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
